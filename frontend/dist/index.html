<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUSCOPE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ef;color:#202226;font:15px Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:800}.tag{color:#9b2335;font-weight:bold}.status{background:white;border:1px solid #e4dfd6;border-radius:20px;padding:8px 13px;color:#39735a}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:35px 0 22px}.hero h1{font-size:38px;margin:0 0 8px}.hero p{color:#6d7278;max-width:700px}.btn{background:#9b2335;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:bold;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.metric,.card{background:white;border:1px solid #e4dfd6;border-radius:15px;padding:18px;box-shadow:0 10px 30px #00000009}.metric b{display:block;font-size:26px}.metric span,.muted{color:#70757b}.main{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card h2{font-size:17px;margin-top:0}.incident{border:1px solid #e4dfd6;border-radius:12px;padding:15px;margin:10px 0;cursor:pointer}.row{display:flex;justify-content:space-between;gap:10px}.pill{border-radius:99px;padding:5px 9px;font-size:12px;font-weight:bold}.critical{background:#f8e3e7;color:#8e1f30}.high{background:#fbefd7;color:#9a5b08}.medium{background:#f5f0d9;color:#7c6610}.evidence{background:#f8f7f3;padding:12px;border-radius:10px}.ai{display:inline-block;border:1px solid #ded8cf;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:bold;margin-left:6px}.ai.on{color:#39735a;background:#edf7f1}.ai.off{color:#8a5a16;background:#fbf3df}.trace{background:#f3f1ec;border-radius:9px;padding:10px;margin-top:10px;font-size:12px}.alert{padding:8px 0;border-bottom:1px solid #eee}.small{font-size:13px}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr}.hero{flex-direction:column;align-items:start}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="brand">NEXUSCOPE</div><div class="tag">From Alerts to Action · PS07</div></div><div class="status" id="status">● System ready</div></div>
<div class="hero"><div><h1>Network Incident Triage</h1><p>Turn noisy alerts into explainable incidents, grounded response actions, and human escalation when evidence is not enough.</p></div><button class="btn" onclick="run()">Analyze alert stream</button></div>
<div class="metrics" id="metrics"></div><div class="main"><section class="card"><h2>Prioritized incidents</h2><div id="incidents">Loading…</div></section><aside><section class="card"><h2>Selected incident</h2><div id="detail" class="muted">Select an incident.</div></section><section class="card"><h2>Alerts left as noise</h2><div id="noise"></div></section></aside></div></div>
<script>
let S;const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function run(){document.getElementById('status').textContent='● Analyzing…';S=await(await fetch('/api/analyze')).json();render();document.getElementById('status').textContent=S.ai.gemini_available?'● Gemini grounded':'● Local fallback mode'}
function render(){let s=S.summary;document.getElementById('metrics').innerHTML=[['Alerts',s.alerts_received],['Incidents',s.incidents_created],['Critical',s.critical],['AI grounded',s.gemini_grounded],['Escalations',s.escalations]].map(x=>`<div class="metric"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
document.getElementById('incidents').innerHTML=S.incidents.map((i,n)=>`<div class="incident" onclick="show(${n})"><div class="row"><strong>${e(i.incident_id)} · ${e(i.title)}</strong><span class="pill ${i.priority.toLowerCase()}">${i.priority} · ${i.score}</span></div><div class="small muted">${i.alert_count} related alerts · ${i.runbook_id||'No matching runbook'} ${i.gemini_used?'<span class="ai on">GEMINI</span>':'<span class="ai off">LOCAL</span>'}</div><div class="small">${e(i.recommended_action)}</div></div>`).join('');
document.getElementById('noise').innerHTML=S.noise.map(a=>`<div class="alert"><b>${e(a.type)}</b> <span class="muted">${e(a.device)} · ${e(a.description)}</span></div>`).join('')||'<span class="muted">None</span>';show(0)}
function show(n){let i=S.incidents[n];if(!i)return;document.getElementById('detail').innerHTML=`<div class="row"><strong>${e(i.title)}</strong><span class="pill ${i.priority.toLowerCase()}">${i.priority}</span></div><p class="small muted">Score ${i.score}/100 · confidence ${(i.confidence*100).toFixed(0)}% · ${i.human_decision}</p><h3 class="small">Why prioritized</h3><ul>${i.reasons.map(e).map(x=>`<li>${x}</li>`).join('')}</ul><h3 class="small">AI triage reasoning</h3><p>${e(i.gemini_reasoning||'Deterministic safeguards selected the priority from observed alert types; Gemini reasoning is unavailable in this run.')}</p><h3 class="small">Recommended response</h3><p>${e(i.recommended_action)}</p><div class="evidence"><b>Runbook evidence · ${i.runbook_id||'ESCALATE'}</b><div class="trace">Retrieval: ${e(i.retrieval_method||'n/a')}${i.retrieval_score?` · similarity ${i.retrieval_score}`:''}${i.evidence_refs?.length?`<br>Evidence refs: ${e(i.evidence_refs.join(', '))}`:''}</div>${i.evidence.length?'<ul>'+i.evidence.map(e).map(x=>`<li>${x}</li>`).join('')+'</ul>':'<p>No runbook covers this incident. Human review is required; NEXUSCOPE will not guess.</p>'}</div><h3 class="small">Grouped alerts</h3>${i.alerts.map(a=>`<div class="alert"><b>${e(a.type)}</b> <span class="muted">${e(a.device)} · ${e(a.time)}</span></div>`).join('')}`}
run();
</script></body></html>
